name: "Challenge 3: Join the Conversation"
description: Comment on a classmate's issue using @mentions and reactions.
title: "Challenge 3: Join the Conversation (@{username})"
labels: ["challenge", "day-1"]
body:
  - type: markdown
    attributes:
      value: |
        ## Challenge 3: Join the Conversation

        **Chapter:** [Ch05: Working with Issues](https://github.com/Community-Access/git-going-with-github/blob/main/docs/05-working-with-issues.md)

        **What you will do:** Practice GitHub's collaboration features by commenting on a buddy's issue, using @mentions, and adding reactions.

        ### Instructions

        1. Find your buddy's Challenge 2 issue (the one they just filed).
        2. Leave a **meaningful comment** on their issue. Ideas:
           - Confirm you can reproduce the problem they described
           - Suggest an approach to fix it
           - Ask a clarifying question
        3. Use an **@mention** to tag your buddy in your comment (type `@` followed by their username).
        4. Add a **reaction** (thumbs up, heart, or any emoji) to their original issue.

        ### Good commenting tips

        - Be specific ("I found the same TODO on line 12" is better than "I agree")
        - Be encouraging ("Great find!" is always welcome)
        - Be constructive (suggest, do not just criticize)

  - type: textarea
    id: evidence
    attributes:
      label: "Your evidence"
      description: "Paste the URL of the comment you left on your buddy's issue."
      placeholder: |
        Comment URL: https://github.com/...
        I commented on @buddy's issue about...
        I used a reaction to...
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ### Buddy check

        Your buddy should have commented on YOUR Challenge 2 issue too. Check for their comment and reply to it.

        ### If you get stuck

        | Symptom | Try this |
        |---|---|
        | I cannot find my buddy's issue | Go to the Issues tab and look for their name in the issue title, or filter by the "day-1" label. |
        | The @mention is not working | Make sure there is no space between the @ and the username. The username must match exactly. |
        | I do not know how to add a reaction | Look for a smiley face icon at the top-right of the issue comment. Screen reader users: the button is labeled "Add reaction". |
        | I finished but want to check my work | [View the reference solution](https://github.com/Community-Access/git-going-with-github/blob/main/docs/solutions/solution-03-conversation.md) |
