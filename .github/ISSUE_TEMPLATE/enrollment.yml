name: "Workshop Enrollment - New Student Fast Path"
description: "Beginner-friendly enrollment for the GIT Going with GitHub learning room"
title: "[ENROLL] GIT Going with GitHub Learning Room"
labels: ["classroom-enrollment"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## Welcome. You are in the right place.

        This form takes about 2 minutes.
        After you submit, automation will process your enrollment and post your next steps in a comment on this issue.

        You will work through Day 1 and Day 2 challenges in your own private learning room repository. Day 2 content automatically unlocks after you complete Day 1.

        **You only need a GitHub account.**

  - type: input
    id: full-name
    attributes:
      label: Full Name
      description: Your name as you want facilitators to address you.
      placeholder: Jane Doe
    validations:
      required: true

  - type: input
    id: email
    attributes:
      label: Email Address
      description: Used for workshop communication and support follow-up.
      placeholder: jane.doe@example.com
    validations:
      required: true

  - type: dropdown
    id: github-experience
    attributes:
      label: Experience with GitHub
      description: Select the option that best describes you.
      options:
        - "New - I just created my account or I have barely used GitHub"
        - "Some experience - I have explored repos/issues but still learning"
        - "Confident - I have used branches, pull requests, or issues"
    validations:
      required: true

  - type: dropdown
    id: vscode-experience
    attributes:
      label: Experience with Visual Studio Code
      description: Select the option that best describes you.
      options:
        - "New - I am just getting started with VS Code"
        - "Some experience - I can open projects and edit files"
        - "Confident - I use VS Code regularly"
    validations:
      required: true

  - type: textarea
    id: course-goals
    attributes:
      label: What do you hope to get out of this course?
      description: Tell us your goals in your own words. This helps us tailor the experience.
      placeholder: |
        I want to feel confident using Git and GitHub with a screen reader.
        I want to learn how to contribute to open source projects.
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---
        **Privacy note:** this repository is public. Automation will process your submission, then replace the public issue body with a redacted summary.

        **What happens next:**
        1. Submit this form.
        2. Wait for the automation comment (usually under 1 minute).
        3. Watch for a GitHub invitation to your private learning room (notification bell and email), then accept it.
        4. Reply `ack` on this issue, then close it as **Challenge 0**.
        5. Open your learning room's Issues tab and begin Challenge 1. Complete Day 1 challenges to automatically unlock Day 2.

        Need help? Open a support request: https://github.com/Community-Access/support/issues
