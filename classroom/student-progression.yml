name: Student Progression Bot

on:
  issues:
    types: [closed]
  pull_request:
    types: [closed]

permissions:
  issues: write
  pull-requests: write

jobs:
  unlock_next_challenge:
    runs-on: ubuntu-latest
    steps:
      - name: Unlock Next Step
        uses: actions/github-script@v7
        with:
          script: |
            const eventName = context.eventName;
            let currentTitle = "";
            let triggerType = "";

            if (eventName === 'issues') {
              currentTitle = context.payload.issue.title;
              triggerType = 'issue';
            } else if (eventName === 'pull_request' && context.payload.pull_request.merged) {
              currentTitle = context.payload.pull_request.title;
              triggerType = 'pr';
            } else {
              return; // We only care about closed issues and merged PRs
            }

            // Provide step definitions for all 9 Day 1 challenges
            const sequence = [
              { 
                triggerTitle: "Challenge 1:", 
                triggerType: "issue",
                nextTitle: "Challenge 2: File Your First Issue",
                nextBody: `🎉 **Magical! You've completed Challenge 1!**\n\nWelcome to your next step in the journey. Now that you've found your way around the repository, it's time to practice communicating with your team using GitHub Issues. Issues are like a shared to-do list where teams discuss ideas, bugs, and tasks.\n\n📍 **Your Goal:**\nFile a new issue describing something you noticed in the repository. It can be a typo, an idea for improvement, or just a hello!\n\n👣 **Step-by-Step:**\n\n<details>\n<summary><b>Web Browser</b></summary>\n\n1. Navigate to the **Issues** tab near the top of your repository page.\n2. Select the **New issue** button.\n3. Provide a clear and descriptive **Title** for your issue (e.g., "Idea: Add a welcome banner").\n4. In the **Add a description** text area, write a sentence or two explaining your thought.\n5. Create the issue by selecting the **Submit new issue** button.\n\n</details>\n\n<details>\n<summary><b>Visual Studio Code</b></summary>\n\n1. Open the **GitHub Pull Requests and Issues** view (\`Ctrl+Shift+G\` or \`Cmd+Shift+G\` on Mac).\n2. Open the **Issues** creation form by selecting the **+** (plus icon) next to the **Issues** header or use the command palette (\`Ctrl+Shift+P\`) and search for **"GitHub Issues: Create Issue..."**.\n3. Choose the current repository if prompted.\n4. Enter a descriptive title in the top prompt bar.\n5. For the description, a scratchpad file will open. Type your thought there and save it to submit.\n\n</details>\n\n<details>\n<summary><b>Command Line (GitHub CLI)</b></summary>\n\n1. Run the interactive issue creator: \`gh issue create\`.\n2. Follow the prompts:\n   - **What would you like to do?**: Choose **"Create a new issue"**.\n   - **Title**: Enter a clear title (e.g., "Idea: Add a welcome banner").\n   - **Body**: Select **"Write with editor"** or **"Input text"** and type your sentence.\n   - **What's next?**: Select **"Submit"**.\n\n</details>\n\n✅ **Expected Outcome:**\nYou should see your newly created issue with a unique number (like \`#2\`). Take a deep breath—you just started a conversation in open source!\n\n🛠️ **Troubleshooting (If you get stuck):**\n- **Don't see the New Issue button?** Make sure you are in the "Issues" tab, not Pull Requests or Actions.\n- **Not sure what to write?** Simply say "Hello World! This is my first issue."\n- **Need more context?** Read [Chapter 5: Working with Issues](https://github.com/Community-Access/git-going-with-github/blob/main/docs/05-working-with-issues.md).\n\n🔓 **To Unlock Challenge 3:**\nWhen you are done, come back to **this** issue (Challenge 2) and click the **Close issue** button at the bottom. The bot will automatically unlock your next adventure!`
              },
              { 
                triggerTitle: "Challenge 2:", 
                triggerType: "issue",
                nextTitle: "Challenge 3: Join the Conversation",
                nextBody: `🚀 **Amazing job! Challenge 2 is in the books.**\n\nCommunication in open source is all about collaboration. Sometimes you need to draw someone's attention to a specific issue. We do this using \`@mentions\`.\n\n📍 **Your Goal:**\nMention Aria, your Workshop Agent, in a comment to ask for a workspace check.\n\n👣 **Step-by-Step:**\n\n<details>\n<summary><b>Web Browser</b></summary>\n\n1. Navigate to the **Issues** tab and select an open issue.\n2. Navigate to the "Leave a comment" text area at the bottom of the issue thread.\n3. Type the \`@\` symbol followed by the handle \`aria-bot\`. A menu should appear to help you select a name.\n4. Add a friendly message like, "@aria-bot could you please check my work?"\n5. Send your comment by selecting the **Comment** button.\n\n</details>\n\n<details>\n<summary><b>Visual Studio Code</b></summary>\n\n1. Open the **GitHub Issues** panel.\n2. Choose your open issue from the list.\n3. In the issue's **Comment** text area, type \`@aria-bot\`. VS Code will often provide suggestions for you.\n4. Add your message: "@aria-bot could you please check my work?"\n5. Send your comment by selecting the **Comment** button or using \`Ctrl+Enter\` (\`Cmd+Enter\` on Mac).\n\n</details>\n\n<details>\n<summary><b>Command Line (GitHub CLI)</b></summary>\n\n1. Identify the issue number you want to comment on: \`gh issue list\`.\n2. Run the command to add a comment: \`gh issue comment [issue-number] --body "@aria-bot could you please check my work?"\`.\n3. Verify your comment was posted: \`gh issue view [issue-number] --comments\`.\n\n</details>\n\n✅ **Expected Outcome:**\nYour comment will appear in the issue, and the person you mentioned will receive a notification.\n\n🛠️ **Troubleshooting:**\n- **Can't find a username?** Ask your buddy for their exact GitHub handle.\n- **The dropdown didn't appear?** Make sure there is no space between the \`@\` and the username.\n- **Want more details?** Read [Chapter 5: Working with Issues](https://github.com/Community-Access/git-going-with-github/blob/main/docs/05-working-with-issues.md).\n\n🔓 **To Unlock Challenge 4:**\nPost a link to your comment right here, and then click **Close issue**. Your next task awaits!`
              },
              { 
                triggerTitle: "Challenge 3:", 
                triggerType: "issue",
                nextTitle: "Challenge 4: Branch Out",
                nextBody: `🌟 **You're a communication pro! Let's get into the code.**\n\nIn Git, a "branch" is a safe space to work on your ideas without affecting the main project. Think of it as a parallel universe where you can experiment!\n\n📍 **Your Goal:**\nCreate a feature branch where you can safely make changes.\n\n👣 **Step-by-Step:**\n\n<details>\n<summary><b>Web Browser</b></summary>\n\n1. Navigate to the **Code** tab.\n2. Locate the branch selector button (it currently indicates **main**).\n3. Access the dropdown and type a new name for your branch in the search box (e.g., \`feature/my-first-edit\`).\n4. Select the option that says **Create branch: [your-branch-name] from 'main'**.\n\n</details>\n\n<details>\n<summary><b>Visual Studio Code</b></summary>\n\n1. Open the **Source Control** view (\`Ctrl+Shift+G\` or \`Cmd+Shift+G\` on Mac).\n2. Open the **More Actions (...)** menu or select the **Branch Name** indicator in the Status Bar (bottom left).\n3. Choose **Branch** → **Create Branch...**.\n4. Type your branch name: \`feature/my-first-edit\`.\n\n</details>\n\n<details>\n<summary><b>Command Line (Git)</b></summary>\n\n1. Create a new branch: \`git checkout -b feature/my-first-edit\`.\n2. Confirm you are on the new branch: \`git branch\`.\n3. Inform GitHub of your choice: \`git push -u origin feature/my-first-edit\`.\n\n</details>\n\n✅ **Expected Outcome:**\nThe page will refresh, and the branch dropdown will now show your new branch name instead of \`main\`. You are now working safely in your own branch!\n\n🛠️ **Troubleshooting:**\n- **Can't type a name?** Ensure you clicked the button that says "main" to open the menu.\n- **Branch names can't have spaces.** Use hyphens or underscores instead!\n- **Need more guidance?** Read [Chapter 4: The Learning Room](https://github.com/Community-Access/git-going-with-github/blob/main/docs/04-the-learning-room.md).\n\n🔓 **To Unlock Challenge 5:**\nReply to this issue with your new branch name, and then click **Close issue**!`
              },
              { 
                triggerTitle: "Challenge 4:", 
                triggerType: "issue",
                nextTitle: "Challenge 5: Make Your Mark",
                nextBody: `🌿 **Branch created! You're ready to make your mark.**\n\nNow that you have a safe branch, it's time to edit a file and save your changes. Saving changes in Git is called making a "commit."\n\n📍 **Your Goal:**\nEdit a file in your repository and make a commit with a clear message.\n\n👣 **Step-by-Step:**\n\n<details>\n<summary><b>Web Browser</b></summary>\n\n1. Verify you are on the branch you just created (check the branch selector).\n2. Select a file you wish to edit (for example, the \`README.md\` file).\n3. Access the **Edit this file** button (pencil icon) to enter the editor.\n4. Make a small text change—add your name, fix a typo, or add a greeting.\n5. Provide a short, descriptive commit message in the summary box (e.g., "Add my name to the README").\n6. Save your changes by selecting the **Commit changes** button.\n\n</details>\n\n<details>\n<summary><b>Visual Studio Code</b></summary>\n\n1. Verify you are on the new branch (check the Status Bar).\n2. Open the \`README.md\` file (or another of your choice) from the Explorer.\n3. Make a change in the editor and save the file (\`Ctrl+S\`).\n4. Stage your changes (this prepares them for your commit): Use the **Source Control** view (\`Ctrl+Shift+G\` or \`Cmd+Shift+G\` on Mac). Use the arrow keys to focus your file and select the **Stage Changes** icon (plus sign), or use the Command Palette (\`Ctrl+Shift+P\` or \`Cmd+Shift+P\` on Mac) and search for **"Git: Stage Changes"**.\n5. Type your commit message in the message field (e.g., "Add my name to the README").\n6. Finalize your commit: Select the **Commit** button, use \`Ctrl+Enter\` (\`Cmd+Enter\` on Mac), or use the Command Palette (\`Ctrl+Shift+P\` or \`Cmd+Shift+P\` on Mac) and search for **"Git: Commit"**.\n7. Send your work to GitHub: Select the **Sync Changes** or **Publish Branch** button in the Source Control view, or use the Command Palette and search for **"Git: Push"**.\n\n</details>\n\n<details>\n<summary><b>Command Line (Git)</b></summary>\n\n1. Open your text editor and make a change to a file.\n2. Stage the file for your commit: \`git add README.md\`.\n3. Create your commit: \`git commit -m "Add my name to the README"\`.\n4. Send your changes to GitHub: \`git push\`.\n\n</details>\n\n✅ **Expected Outcome:**\nYour changes are securely saved on your branch! You will see your commit message listed at the top of the file view.\n\n🛠️ **Troubleshooting:**\n- **Don't see the pencil icon?** Make sure you are viewing a specific text file, not a folder.\n- **Accidentally saved to the wrong branch?** Don't panic! Ask a facilitator for help—mistakes are part of learning.\n- **Want to read more?** [Chapter 4: The Learning Room](https://github.com/Community-Access/git-going-with-github/blob/main/docs/04-the-learning-room.md) has you covered.\n\n🔓 **To Unlock Challenge 6:**\nLeave a comment here saying "Committed!" and then click **Close issue** to move on!`
              },
              { 
                triggerTitle: "Challenge 5:", 
                triggerType: "issue",
                nextTitle: "Challenge 6: Your First Pull Request",
                nextBody: `💾 **Changes securely committed! Time to share them with the world.**\n\nA Pull Request (PR) is how you ask the project maintainers to merge your branch into the \`main\` branch. It's the core of open source collaboration!\n\n📍 **Your Goal:**\nOpen a Pull Request that tells the maintainers what you changed, and link it back to an issue.\n\n👣 **Step-by-Step:**\n\n<details>\n<summary><b>Web Browser</b></summary>\n\n1. Navigate to the **Pull requests** tab and choose **New pull request**.\n2. Ensure the *base* branch is \`main\` and *compare* is your feature branch.\n3. Choose **Create pull request** and give it a descriptive title.\n4. In the description field, type \`Closes #1\` (or your issue number). \n5. Select **Create pull request** to submit.\n\n</details>\n\n<details>\n<summary><b>Visual Studio Code</b></summary>\n\n1. Open the **GitHub Pull Requests and Issues** view.\n2. Select the **+** (plus icon) next to the **Pull Requests** header.\n3. Choose the **Compare Branch** (e.g., \`feature/my-first-edit\`) and the **Base Branch** (\`main\`).\n4. Type your PR title (e.g., "Add my name to the README").\n5. In the description field, include \`Closes #1\` to link it to your issue.\n6. Select **Create** or use \`Ctrl+Enter\` (\`Cmd+Enter\` on Mac).\n\n</details>\n\n<details>\n<summary><b>Command Line (GitHub CLI)</b></summary>\n\n1. Run the interactive PR creator: \`gh pr create\`.\n2. Follow the prompts:\n   - **Title**: Enter a clear title (e.g., "Add my name to the README").\n   - **Body**: Select **"Write with editor"** and include \`Closes #1\` in your description.\n   - **What's next?**: Select **"Submit"**.\n\n</details>\n\n✅ **Expected Outcome:**\nYour Pull Request is now live! maintainers and reviewers can see what you changed, comment on it, and eventually merge it. The description should show a linked issue.\n\n🛠️ **Troubleshooting:**\n- **It says "There isn't anything to compare."** Make sure you selected the branch you edited in the *compare* dropdown.\n- **The "Closes #number" didn't link?** Ensure you used exactly that phrase and the correct issue number.\n- **More about PRs?** Check out [Chapter 6: Working with Pull Requests](https://github.com/Community-Access/git-going-with-github/blob/main/docs/06-working-with-pull-requests.md).\n\n🔓 **To Unlock Challenge 7:**\nPost a link to your Pull Request right here, then click **Close issue**!`
              },
              { 
                triggerTitle: "Challenge 6:", 
                triggerType: "issue",
                nextTitle: "Challenge 7: Resolve a Merge Conflict",
                nextBody: `🔀 **Pull Request successfully opened! You're doing amazing.**\n\nSometimes, two people edit the exact same part of a file at the same time. Git gets confused and asks the humans to figure it out. This is called a "Merge Conflict."\n\n📍 **Your Goal:**\nUnderstand how to fix a merge conflict, or resolve one if you see the "Resolve conflicts" button on your PR!\n\n👣 **Step-by-Step:**\n\n<details>\n<summary><b>Web Browser</b></summary>\n\n1. If your PR has a conflict, activate the **Resolve conflicts** button.\n2. Look for the markers: \`<<<<<<<\`, \`=======\`, and \`>>>>>>>\`.\n3. Edit the text to your preferred version and remove the markers.\n4. Select **Mark as resolved** and **Commit merge**.\n\n</details>\n\n<details>\n<summary><b>Visual Studio Code</b></summary>\n\n1. Open the **Source Control** view.\n2. If there's a conflict, the file will be listed under **Merge Changes**.\n3. Select the file to open it in the editor.\n4. Use the visual "Resolve in Merge Editor" or use the code actions (e.g., "Accept Current Change") at the top of the conflict block.\n5. Save the file and select the **+** (plus icon) next to it to stage the resolution.\n6. Select **Commit** to finish the merge.\n\n</details>\n\n<details>\n<summary><b>Command Line (Git)</b></summary>\n\n1. Identify the files with conflicts: \`git status\`.\n2. Open the file in your preferred text editor.\n3. Manually remove the conflict markers (\`<<<<<<<\`, \`=======\`, \`>>>>>>>\`) and keep the version you want.\n4. Save the file.\n5. Stage the resolved file: \`git add [file-name]\`.\n6. Finalize the merge: \`git commit\`.\n\n</details>\n\n **Not sure what to do?** Drop a comment: \`@aria-bot I have a merge conflict, can you explain this?\`\n\n✅ **Expected Outcome:**\nThe scary red conflict warning will disappear, replaced by a green checkmark saying "This branch has no conflicts with the base branch."\n\n🛠️ **Troubleshooting:**\n- **Don't have a conflict?** Read the docs to prepare for when you encounter one in the wild!\n- **Accidentally deleted too much?** You can hit Cancel and try again.\n- **Need a deep dive?** Read [Chapter 7: Merge Conflicts](https://github.com/Community-Access/git-going-with-github/blob/main/docs/07-merge-conflicts.md).\n\n🔓 **To Unlock Challenge 8:**\nLeave a comment here explaining how you feel about merge conflicts now, then click **Close issue**!`
              },
              { 
                triggerTitle: "Challenge 7:", 
                triggerType: "issue",
                nextTitle: "Challenge 8: Open Source Culture",
                nextBody: `🛠️ **Conflicts? Handled. You are unstoppable.**\n\nWriting code is only 10% of open source. The rest is communication, empathy, and culture. We want to build an environment where everyone feels they belong.\n\n📍 **Your Goal:**\nReflect on community norms, healthy collaboration, and contribution practices.\n\n👣 **Step-by-Step:**\n1. Take 5 minutes to read through [Chapter 8: Open Source Culture](https://github.com/Community-Access/git-going-with-github/blob/main/docs/08-open-source-culture.md).\n2. Think about a time a project made you feel welcomed, or what you would do to make others feel welcome.\n3. Write a short reflection about how good communication impacts software development.\n\n✅ **Expected Outcome:**\nYou gain a stronger appreciation for the humans behind the screens and how tone in PRs and reviews makes all the difference.\n\n🛠️ **Troubleshooting:**\n- **Not sure what to write?** Just share one sentence about what "assuming best intent" means to you.\n- **Feeling stuck?** Chat with your buddy!\n\n🔓 **To Unlock Challenge 9:**\nRecord your reflection as a comment right here, and then click **Close issue**. The final step is next!`
              },
              { 
                triggerTitle: "Challenge 8:", 
                triggerType: "issue",
                nextTitle: "Challenge 9: Merge Day",
                nextBody: `🌍 **Thank you for taking the time to reflect! We are in the home stretch.**\n\nYou've communicated, branched, committed, and resolved. Now it's the moment of truth. It's time to merge your changes into the main project!\n\n📍 **Your Goal:**\nGet your Pull Request reviewed, approved, and merged!\n\n👣 **Step-by-Step:**\n\n<details>\n<summary><b>Web Browser</b></summary>\n\n1. Navigate back to your Pull Request.\n2. Ask your buddy or a facilitator to review your PR. You can also mention \`@aria-bot\` to let her know you're ready!\n3. Once approved, activate the **Merge pull request** button.\n4. Select **Confirm merge**.\n5. Optional but recommended: Activate the option to **Delete branch** to keep your repository organized.\n\n</details>\n\n<details>\n<summary><b>Visual Studio Code</b></summary>\n\n1. Open the **Pull Requests** view and select your PR.\n2. Select the **More Actions (...)** menu or the **Merge** button at the top of the PR overview.\n3. Choose the merge strategy (e.g., **Create Merge Commit** or **Squash and Merge**).\n4. Select **Confirm Merge**.\n5. Select **Delete Branch** if prompted to keep the repository clean.\n\n</details>\n\n<details>\n<summary><b>Command Line (GitHub CLI)</b></summary>\n\n1. Identify your PR number or use the current branch: \`gh pr list\`.\n2. Run the merge command: \`gh pr merge [pr-number]\`.\n3. Select your merge strategy when prompted (e.g., **Merge commit**).\n4. Choose **Yes** when asked if you want to delete the local and remote branches.\n\n</details>\n\n✅ **Expected Outcome:**\nYour Pull Request will show a purple **Merged** badge. Your code is officially part of the main branch! Take a moment to celebrate. 🎉\n\n🛠️ **Troubleshooting:**\n- **The merge button is greyed out?** You might need to wait for a reviewer to approve it, or checks to pass. Ask a facilitator!\n- **Want to know more about finishing up?** Check [Chapter 10: Notifications and Day 1 Close](https://github.com/Community-Access/git-going-with-github/blob/main/docs/10-notifications-and-day-1-close.md).\n\n🔓 **To Finish Day 1:**\nLeave a comment here saying "MERGED!" and then click **Close issue**.\n\n🏆 **Congratulations!** You have completely finished Day 1. Rest, hydrate, and get ready for a fantastic Day 2!`
              }
            ];

            const step = sequence.find(s => currentTitle.includes(s.triggerTitle) && s.triggerType === triggerType);

            if (step) {
              console.log(`Unlocking: ${step.nextTitle}`);
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: step.nextTitle,
                body: step.nextBody,
                assignees: [context.actor]
              });
            } else {
              console.log('No matching step found or challenge already unlocked.');
            }
